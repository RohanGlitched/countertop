AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Countertop on AWS: the static test bench in S3 behind CloudFront (origin access control), and its model function
  (api/turn.mjs, Amazon Nova Micro on Amazon Bedrock) on AWS Lambda (Node.js 22, arm64) behind a Function URL
  under /api/*, signing with the function's own role (no static keys). Free-tier sized, ap-southeast-2 only.

Parameters:
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
  DailyModelCap:
    Type: Number
    Default: 300
    Description: Model turns per UTC day per instance (spending guard)
  MaxConcurrency:
    Type: Number
    Default: 2
    Description: Reserved concurrency; 0 = don't reserve any

Conditions:
  Reserve: !Not [!Equals [!Ref MaxConcurrency, "0"]]

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  FnRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: countertop
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Bedrock
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/apac.amazon.nova-micro-v1:0"
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/apac.amazon.nova-lite-v1:0"
                  - arn:aws:bedrock:*::foundation-model/amazon.nova-micro-v1:0
                  - arn:aws:bedrock:*::foundation-model/amazon.nova-lite-v1:0

  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-turn"
      RetentionInDays: 14

  Fn:
    Type: AWS::Lambda::Function
    DependsOn: Logs
    Properties:
      FunctionName: !Sub "${AWS::StackName}-turn"
      Description: Countertop model turn (Amazon Nova Micro on Bedrock)
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: infra/lambda.handler
      MemorySize: 256
      Timeout: 30
      ReservedConcurrentExecutions: !If [Reserve, !Ref MaxConcurrency, !Ref AWS::NoValue]
      Role: !GetAtt FnRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      LoggingConfig:
        LogGroup: !Ref Logs
        LogFormat: Text
      Environment:
        Variables:
          BEDROCK_REGION: !Ref AWS::Region
          DAILY_MODEL_CAP: !Ref DailyModelCap

  FnUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Fn.Arn
      AuthType: NONE

  FnUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Fn
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  FnUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Fn
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  ErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Countertop model function errors in five minutes
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref Fn }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  Oac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # The function sees its own URL as Host; the same-origin guard needs the address the visitor used.
  ForwardHostFn:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-forward-host"
      AutoPublish: true
      FunctionConfig: { Comment: viewer Host to x-forwarded-host, Runtime: cloudfront-js-2.0 }
      FunctionCode: |
        function handler(event) {
          var r = event.request;
          r.headers['x-forwarded-host'] = { value: r.headers.host.value };
          return r;
        }

  Cdn:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Countertop
        HttpVersion: http2and3
        PriceClass: PriceClass_All
        DefaultRootObject: index.html
        Origins:
          - Id: site
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginPath: /site
            S3OriginConfig: { OriginAccessIdentity: "" }
            OriginAccessControlId: !GetAtt Oac.Id
          - Id: api
            DomainName: !Select [2, !Split ["/", !GetAtt FnUrl.FunctionUrl]]
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2], OriginReadTimeout: 30 }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # SecurityHeadersPolicy
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ForwardHostFn.FunctionMetadata.FunctionARN
        # no CustomErrorResponses: they would also rewrite /api/turn's own 403 and 429 answers

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${Bucket.Arn}/site/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Cdn}"

Outputs:
  SiteUrl:
    Value: !Sub "https://${Cdn.DomainName}"
  DistributionId:
    Value: !Ref Cdn
  Bucket:
    Value: !Ref Bucket
  FunctionUrl:
    Value: !GetAtt FnUrl.FunctionUrl
  FunctionName:
    Value: !Ref Fn
